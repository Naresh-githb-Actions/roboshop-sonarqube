name: RoboShop CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

jobs:

  cart:

    runs-on: master01

    defaults:
      run:
        working-directory: cart

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cart/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
